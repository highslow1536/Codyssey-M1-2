# Free API only. Optional paid Discord worker: deploy/render-worker.yaml.
# Never put secret values here. sync:false values are entered in the dashboard.
services:
  - type: web
    name: stock-market-assistant-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.lock
    startCommand: python -m jobs.check_config --component api && exec uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: APP_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ALLOWED_USER_UIDS
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: JOB_OWNER_UID
        sync: false
      - key: DATA_POLL_MINUTES
        value: "5"
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: NEWS_CACHE_MINUTES
        value: "30"
      - key: SENTIMENT_CACHE_MINUTES
        value: "30"
      - key: ANALYSIS_CACHE_MINUTES
        value: "30"
